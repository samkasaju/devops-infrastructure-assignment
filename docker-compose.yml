services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: traineedb
      POSTGRES_USER: trainee
      POSTGRES_PASSWORD: trainee_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trainee -d traineedb"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./app
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      POSTGRES_DB: traineedb
      POSTGRES_USER: trainee
      POSTGRES_PASSWORD: trainee_password
      APP_PORT: "5000"
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "5000"

  nginx:
    image: nginx:alpine
    depends_on:
      - backend
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  postgres_data:
